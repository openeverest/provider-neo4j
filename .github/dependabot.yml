# Dependabot opens a PR when a new operator release is available. The operator
# is pinned twice: as a Helm subchart (charts/provider-neo4j/Chart.yaml) and as
# a Go module (its API types and CRDs, in go.mod).
#
# Only the subchart is tracked. The operator's module path
# (github.com/neo4j/...) differs from its repository
# (github.com/neo4j-partners/...), so go.mod pins it with a replace directive,
# which Dependabot does not update. A unit test fails the PR until the replace
# directive is bumped to the same version and `make generate` is run.
version: 2

multi-ecosystem-groups:
  operator:
    schedule:
      interval: "daily"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "helm"
    directory: "/charts/provider-neo4j"
    allow:
      - dependency-name: "neo4j-operator"
    patterns:
      - "neo4j-operator"
    multi-ecosystem-group: "operator"
