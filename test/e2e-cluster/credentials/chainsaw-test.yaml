apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: e2e-credentials
spec:
  description: |
    A standalone created with a user Secret takes the password in it. A new
    password in the Secret is set in Neo4j before the connection Secret
    advertises it, and a different user is rejected.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,neo4j,pods -o yaml
    - script:
        content: kubectl -n $NAMESPACE get events --sort-by=.lastTimestamp | tail -40
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-neo4j
        tail: 100
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=neo4j-operator
        tail: 100
  steps:
    - name: provider-and-operator-running
      try:
        - assert:
            file: 00-assert.yaml

    - name: create-instance
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            timeout: 10m
            file: 10-assert.yaml
        - script:
            content: |
              set -eu
              secret=$(kubectl -n $NAMESPACE get instance graph -o jsonpath='{.status.connectionSecretRef.name}')
              test "$(kubectl -n $NAMESPACE get secret "$secret" -o jsonpath='{.data.password}' | base64 -d)" = first-password
              ../cypher.sh graph "CREATE (:E2E {v: 1})"

    - name: change-password
      try:
        - apply:
            file: 20-change-password.yaml
        - script:
            timeout: 5m
            content: |
              set -eu
              secret=$(kubectl -n $NAMESPACE get instance graph -o jsonpath='{.status.connectionSecretRef.name}')
              until test "$(kubectl -n $NAMESPACE get secret "$secret" -o jsonpath='{.data.password}' | base64 -d)" = second-password; do
                sleep 5
              done
        - assert:
            timeout: 5m
            file: 10-assert.yaml
        - script:
            content: |
              set -eu
              # The connection Secret's password works over Bolt.
              count=$(../cypher.sh graph "MATCH (n:E2E) RETURN count(n) AS c" | tail -n 1)
              test "$count" = 1
              # The old one does not.
              if kubectl -n $NAMESPACE exec graph-server-0 -- cypher-shell -a neo4j+ssc://localhost:7687 \
                  -u neo4j -p first-password "RETURN 1"; then
                echo "the old password still works" >&2
                exit 1
              fi

    - name: reject-user-change
      try:
        - apply:
            file: 30-change-user.yaml
        - assert:
            timeout: 2m
            file: 30-assert.yaml
        - script:
            content: |
              set -eu
              secret=$(kubectl -n $NAMESPACE get instance graph -o jsonpath='{.status.connectionSecretRef.name}')
              test "$(kubectl -n $NAMESPACE get secret "$secret" -o jsonpath='{.data.password}' | base64 -d)" = second-password
        - apply:
            file: 20-change-password.yaml
        - assert:
            timeout: 5m
            file: 10-assert.yaml
