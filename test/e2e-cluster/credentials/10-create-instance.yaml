apiVersion: v1
kind: Secret
metadata:
  name: graph-user
  labels:
    openeverest.io/provider: neo4j
    openeverest.io/definition: user
stringData:
  NEO4J_AUTH: neo4j/first-password
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: graph
spec:
  providerRef:
    name: neo4j
  topology:
    type: standalone
  version: "2026.07.1"
  userSecretRef:
    name: graph-user
  components:
    engine:
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
      storage:
        size: 2Gi
