# The provider and the Neo4j operator must be running before the suite starts
# (see the deploy-provider-e2e Make target).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-neo4j
  namespace: provider-system
status:
  readyReplicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j-operator-controller-manager
  namespace: provider-system
status:
  readyReplicas: 1
