apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: graph
status:
  phase: Provisioned
  (conditions[?type == 'Ready'].status | [0]): "True"
  (conditions[?type == 'Available'].status | [0]): "True"
---
apiVersion: v1
kind: Service
metadata:
  name: graph
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 0.0.0.0/0
