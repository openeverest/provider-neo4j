apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: e2e-standalone
spec:
  description: |
    A Community standalone with the default TLS setup becomes Ready, takes
    writes over Bolt with TLS, keeps its data across a version upgrade, and is
    exposed through a LoadBalancer Service.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,neo4j,pods,svc,certificate -o yaml
    - script:
        content: kubectl -n $NAMESPACE get events --sort-by=.lastTimestamp | tail -40
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-neo4j
        tail: 100
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=neo4j-operator
        tail: 100
  steps:
    - name: provider-and-operator-running
      try:
        - assert:
            file: 00-assert.yaml

    - name: create-instance
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            timeout: 10m
            file: 10-assert.yaml

    - name: write-data
      try:
        - script:
            content: |
              ../cypher.sh graph "CREATE (:E2E {v: 1})"

    - name: upgrade-version
      try:
        - patch:
            file: 20-upgrade.yaml
        - assert:
            timeout: 10m
            file: 20-assert.yaml
        - script:
            content: |
              set -eu
              count=$(../cypher.sh graph "MATCH (n:E2E) RETURN count(n) AS c" | tail -n 1)
              test "$count" = 1

    - name: expose-through-load-balancer
      try:
        - patch:
            file: 30-load-balancer.yaml
        - assert:
            timeout: 5m
            file: 30-assert.yaml
