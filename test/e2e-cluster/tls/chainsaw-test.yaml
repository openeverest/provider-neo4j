apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: e2e-tls
spec:
  description: |
    Bring your own CA: a standalone whose certificates a cert-manager CA Issuer
    signs, with an additional DNS name, verifies against the ca.crt of its
    connection Secret and refuses clients without TLS. Invalid TLS settings,
    turning TLS off and changing the issuer are rejected. Changing
    additionalNames waits for maintenance approval, then reissues the
    certificate and restarts the pod.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,neo4j,pods,certificate,issuer -o yaml
    - script:
        content: kubectl -n $NAMESPACE get events --sort-by=.lastTimestamp | tail -40
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-neo4j
        tail: 100
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=neo4j-operator
        tail: 100
  steps:
    - name: provider-and-operator-running
      try:
        - assert:
            file: 00-assert.yaml

    - name: company-ca
      try:
        - apply:
            file: 05-ca.yaml
        - wait:
            apiVersion: cert-manager.io/v1
            kind: Issuer
            name: company-ca
            timeout: 2m
            for:
              condition:
                name: Ready
                value: "true"

    - name: reject-invalid-tls
      try:
        - script:
            content: kubectl apply --dry-run=server -n $NAMESPACE -f 20-admission.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.parameters.tls.issuer.group')): true
              (contains($stderr, 'spec.parameters.tls.issuer')): true
              (contains($stderr, 'spec.parameters.tls.additionalNames')): true
              (contains($stderr, 'spec.parameters.tls.additionalNames[0]')): true
        - script:
            content: kubectl apply --dry-run=server -n $NAMESPACE -f 21-prefer-tls.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.parameters.tls.mode')): true

    - name: create-instance
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            timeout: 10m
            file: 10-assert.yaml

    - name: verified-tls-only
      try:
        - script:
            content: ./verify-tls.sh graph-tls graph.example.test
            check:
              ($error == null): true
              (contains($stdout, 'Verify return code: 0 (ok)')): true
        - script:
            content: ./verify-tls.sh graph-tls graph-tls.$NAMESPACE.svc.cluster.local
            check:
              ($error == null): true
              (contains($stdout, 'Verify return code: 0 (ok)')): true
        - script:
            content: |
              set -eu
              # The connection Secret carries the company CA.
              secret=$(kubectl -n $NAMESPACE get instance graph-tls -o jsonpath='{.status.connectionSecretRef.name}')
              test "$(kubectl -n $NAMESPACE get secret "$secret" -o jsonpath='{.data.ca\.crt}')" = \
                "$(kubectl -n $NAMESPACE get secret company-ca -o jsonpath='{.data.ca\.crt}')"
              password=$(kubectl -n $NAMESPACE get secret "$secret" -o jsonpath='{.data.password}' | base64 -d)
              # Bolt without TLS is refused.
              if kubectl -n $NAMESPACE exec graph-tls-server-0 -- cypher-shell -a bolt://localhost:7687 \
                  -u neo4j -p "$password" "RETURN 1" >/dev/null 2>&1; then
                echo "FAIL: Bolt without TLS was accepted"; exit 1
              fi
              ../cypher.sh graph-tls "RETURN 1"

    - name: reject-tls-changes
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE patch instance graph-tls --type=merge \
                -p '{"spec":{"parameters":{"tls":{"mode":"disabled","issuer":null,"additionalNames":null}}}}'
            check:
              ($error != null): true
              (contains($stderr, 'TLS cannot be turned off')): true
        - script:
            content: |
              kubectl -n $NAMESPACE patch instance graph-tls --type=merge \
                -p '{"spec":{"parameters":{"tls":{"issuer":{"name":"bootstrap"}}}}}'
            check:
              ($error != null): true
              (contains($stderr, 'certificate source')): true

    - name: additional-names-wait-for-approval
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE patch instance graph-tls --type=merge \
                -p '{"spec":{"parameters":{"tls":{"additionalNames":["graph.example.test","graph2.example.test"]}}}}'
        - assert:
            resource:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              metadata:
                name: graph-tls
              status:
                (pendingMaintenance[?starts_with(approvalToken, 'tls-names-')] | length(@)): 1
                (pendingMaintenance[?starts_with(approvalToken, 'tls-names-')].severity | [0]): RollingRestart
        - assert:
            resource:
              apiVersion: neo4j.com/v1
              kind: Neo4j
              metadata:
                name: graph-tls
              spec:
                trust:
                  certManager:
                    (length(dnsNames)): 1

    - name: additional-names-approved
      try:
        - script:
            timeout: 8m
            content: |
              set -eu
              token=$(kubectl -n $NAMESPACE get instance graph-tls \
                -o jsonpath='{.status.pendingMaintenance[0].approvalToken}')
              pod=$(kubectl -n $NAMESPACE get pod graph-tls-server-0 -o jsonpath='{.metadata.uid}')
              kubectl -n $NAMESPACE patch instance graph-tls --type=merge \
                -p "{\"spec\":{\"maintenance\":{\"approved\":\"$token\"}}}"
              i=0
              until [ "$(kubectl -n $NAMESPACE get pod graph-tls-server-0 -o jsonpath='{.metadata.uid}' 2>/dev/null)" != "$pod" ]; do
                i=$((i + 1))
                [ "$i" -lt 60 ] || { echo "FAIL: pod not restarted"; exit 1; }
                sleep 5
              done
              kubectl -n $NAMESPACE wait --for=condition=Ready pod/graph-tls-server-0 --timeout=6m
        - assert:
            timeout: 5m
            resource:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              metadata:
                name: graph-tls
              status:
                (conditions[?type == 'Ready'].status | [0]): "True"
                (length(pendingMaintenance[?starts_with(approvalToken, 'tls-names-')] || `[]`)): 0
        - script:
            content: ./verify-tls.sh graph-tls graph2.example.test
            check:
              ($error == null): true
              (contains($stdout, 'Verify return code: 0 (ok)')): true
