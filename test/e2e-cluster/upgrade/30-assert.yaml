# The change waits for approval, and the operator runs what the previous
# release applied.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: graph
status:
  # Null-safe: pendingMaintenance is absent until the provider has seen the
  # patch, and a type error would fail the assert instead of retrying it.
  (length(pendingMaintenance || `[]`)): 1
  (starts_with(pendingMaintenance[0].approvalToken || '', 'upgrade-to-')): true
  pendingMaintenance:
    - severity: Downtime
  (conditions[?type == 'MaintenancePending'].status | [0]): "True"
  (conditions[?type == 'Ready'].status | [0]): "True"
---
apiVersion: neo4j.com/v1
kind: Neo4j
metadata:
  name: graph
  annotations:
    neo4j.openeverest.io/provider-release: 0.0.1
spec:
  resources:
    limits:
      cpu: 1100m
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: graph
spec:
  template:
    spec:
      (containers[?name == 'neo4j'].resources.limits.cpu | [0]): 1100m
status:
  replicas: 1
  readyReplicas: 1
  updatedReplicas: 1
  (currentRevision == updateRevision): true
