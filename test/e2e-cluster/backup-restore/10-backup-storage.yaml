apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: seaweedfsadmin
  AWS_SECRET_ACCESS_KEY: seaweedfsadmin
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: seaweedfs-s3
spec:
  backupStorageClassRef:
    name: s3
  location:
    objectStore:
      bucket: backups
  parameters:
    region: us-east-1
    endpointURL: http://seaweedfs.seaweedfs.svc.cluster.local
    forcePathStyle: true
    implementation: other
  authentication:
    mode: AccessKey
    credentialsSecretRef:
      name: seaweedfs-s3-credentials
