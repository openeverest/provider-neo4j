apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: solo
spec:
  providerRef:
    name: neo4j
  topology:
    type: cluster
  version: "2026.10.2"
  parameters:
    edition: enterprise
    licenseAcceptance: eval
  components:
    engine:
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 2Gi
      storage:
        size: 2Gi
