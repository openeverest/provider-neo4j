# Chainsaw configuration shared by the e2e-cluster suites, which run a real
# Neo4j through the Neo4j operator.
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: e2e-cluster
spec:
  timeouts:
    apply: 60s
    assert: 60s
    delete: 120s
    error: 60s
    exec: 120s
    # Deleting the namespace waits for every Neo4j pod and volume.
    cleanup: 10m
  cleanup:
    skipDelete: false
  report:
    format: XML
    name: chainsaw-report
    path: /tmp
