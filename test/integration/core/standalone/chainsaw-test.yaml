apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: core-standalone
spec:
  description: Create, report status for, and delete a Neo4j Instance.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,neo4j -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-neo4j
        tail: 100
  steps:
    - name: provider-deployed
      try:
        - assert:
            file: 00-assert.yaml
    - name: create-instance
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            file: 10-assert.yaml
    - name: instance-ready
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE create secret generic test-instance-auth \
                --from-literal=NEO4J_AUTH=neo4j/test-password
              generation=$(kubectl -n $NAMESPACE get neo4j test-instance -o jsonpath='{.metadata.generation}')
              version=$(kubectl -n $NAMESPACE get neo4j test-instance -o jsonpath='{.spec.version}')
              now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              # The Neo4j operator is scaled to 0, so report what it would
              # write for a ready standalone server.
              kubectl -n $NAMESPACE patch neo4j test-instance --subresource=status --type=merge -p "$(cat <<EOF
              {"status": {
                "phase": "Running",
                "observedGeneration": ${generation},
                "version": "${version}",
                "serverSummary": {"servers": 1, "ready": 1},
                "conditions": [{"type": "Ready", "status": "True", "reason": "AllMembersReady",
                  "message": "1/1 servers ready", "observedGeneration": ${generation}, "lastTransitionTime": "${now}"}],
                "credentials": {"secretName": "test-instance-auth", "generated": true},
                "endpoints": {"neo4j": "neo4j://test-instance:7687"}
              }}
              EOF
              )"
        - assert:
            file: 11-assert.yaml
    - name: delete-instance
      try:
        - script:
            content: kubectl -n $NAMESPACE delete instance test-instance
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-instance
            for:
              deletion: {}
