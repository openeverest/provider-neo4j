# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: monitoring-metrics-policy
spec:
  description: |
    spec.monitoring.sources.metrics.policy: Always turns Neo4j Enterprise's
    Prometheus endpoint on without any monitoring destination, and once Neo4j
    is Ready the provider publishes it for a scraper OpenEverest does not
    configure. Back on OnDemand nothing needs metrics, so the endpoint goes.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,neo4j -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-neo4j
        tail: 100
  steps:
    - name: provider-deployed
      try:
        - assert:
            file: 00-assert.yaml

    - name: create-instance-with-metrics-always
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            file: 10-assert.yaml

    # The Neo4j operator is scaled to 0: report what it writes for a ready
    # standalone server.
    - name: instance-ready
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE create secret generic neo4j-metrics-policy-auth \
                --from-literal=NEO4J_AUTH=neo4j/test-password
              generation=$(kubectl -n $NAMESPACE get neo4j neo4j-metrics-policy -o jsonpath='{.metadata.generation}')
              now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              kubectl -n $NAMESPACE patch neo4j neo4j-metrics-policy --subresource=status --type=merge -p "$(cat <<EOF
              {"status": {
                "phase": "Running",
                "observedGeneration": ${generation},
                "version": "2026.07.1",
                "serverSummary": {"servers": 1, "ready": 1},
                "conditions": [{"type": "Ready", "status": "True", "reason": "AllMembersReady",
                  "message": "1/1 servers ready", "observedGeneration": ${generation}, "lastTransitionTime": "${now}"}],
                "credentials": {"secretName": "neo4j-metrics-policy-auth", "generated": true},
                "endpoints": {"neo4j": "neo4j://neo4j-metrics-policy:7687"}
              }}
              EOF
              )"
        - assert:
            file: 11-assert.yaml

    - name: back-to-on-demand
      try:
        - apply:
            file: 20-on-demand.yaml
        - assert:
            file: 20-assert.yaml

    - name: delete-instance
      try:
        - script:
            content: kubectl -n $NAMESPACE delete instance neo4j-metrics-policy --wait=false
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: neo4j-metrics-policy
            timeout: 2m
            for:
              deletion: {}
