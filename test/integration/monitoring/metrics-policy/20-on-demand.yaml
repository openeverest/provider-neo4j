apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: neo4j-metrics-policy
spec:
  providerRef:
    name: neo4j
  topology:
    type: standalone
  version: "2026.07.1"
  parameters:
    edition: enterprise
    licenseAcceptance: eval
    tls:
      mode: disabled
  components:
    engine:
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
      storage:
        size: 10Gi
  monitoring:
    sources:
      metrics:
        policy: OnDemand
