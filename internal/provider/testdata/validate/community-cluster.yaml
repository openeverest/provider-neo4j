apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: example
spec:
  providerRef:
    name: neo4j
  topology:
    type: cluster
  version: 2026.07.1
  components:
    engine:
      replicas: 2
      storage:
        size: 10Gi
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
